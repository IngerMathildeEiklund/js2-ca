<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WHIMZY | Homepage</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header-logo">
      <nav>
        <a href="/index.html"
          ><img src="src/images/logo3.png" alt="company logo" />
        </a>
      </nav>
    </header>

    <main>
      <div>
        <button id="back-button" class="border-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-narrow-left"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M5 12l14 0" />
            <path d="M5 12l4 4" />
            <path d="M5 12l4 -4" />
          </svg>
        </button>
      </div>
      <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
      <div id="loggedin-and-make-post-container">
        <form id="publish-post">
          <p class="heading-p">Create a new post</p>
          <label for="post-title">Post title</label>
          <input type="text" id="post-title" name="title" />
          <label for="publish-post-textarea"> Post body: Optional </label>
          <textarea
            id="publish-post-textarea"
            name="publishPost"
            rows="5"
            cols="40"
            required
          ></textarea>

          <button id="add-image-button" class="border-button" type="button">
            Add an image
          </button>

          <div class="optional-image-container hidden">
            <details>
              Note! Not all urls can be used. Get the right format by right
              clicking an image and selecting "Copy image address".
            </details>
            <label for="url-string"> Image:</label>
            <input
              id="url-string"
              type="url"
              name="imageUrl"
              placeholder="eg. https://images.unsplash.com/photo-1582794543139-8ac9cb0f7b11?q=80&w=927&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            />
            <label for="image-alt"> Describe your image: </label>
            <input
              type="text"
              id="image-alt"
              name="imageAlt"
              placeholder="eg. A bouquet of pink roses"
            />
          </div>

          <label for="tags"> Tags: Optional</label>
          <input type="text" id="tags" name="tags" maxlength="30" />
          <button id="publish-post-button" type="submit">Publish post</button>
        </form>
      </div>

      <div class="following-container">
        <p class="heading-p">Profiles you follow</p>
        <ul id="following"></ul>
      </div>

      <h1 class="centered-h1">Newest posts</h1>
      <div class="searchbar-div">
        <label for="searchbar"> Search for a post </label>
        <input id="searchbar" type="text" />
      </div>
      <section id="render-posts"></section>

      <div class="pagination-controls">
        <button id="prev-button">Previous</button>
        <p id="total-pages"></p>
        <button id="next-button">Next</button>
      </div>
    </main>
    <script src="./src/main.ts" type="module"></script>
  </body>
</html>
