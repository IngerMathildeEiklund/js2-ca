<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WHIMZY | Homepage</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="flex flex-col">
      <header
      class="container mx-auto px-8 my-2 bg-brand border-b-2 border-brand-lighter"
    >
      <nav>
        <a href="/index.html"
          ><img
            src="src/images/logo3.png"
            class="h-15 w-auto md:h-20"
            alt="company logo"
          />
        </a>
      </nav>
    </header>

    <main class="container flex flex-col mx-auto p-2">
      <div>
        <button id="back-button" class="border-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-narrow-left"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M5 12l14 0" />
            <path d="M5 12l4 4" />
            <path d="M5 12l4 -4" />
          </svg>
        </button>
      </div>
      <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
      <div id="loggedin-and-make-post-container" class="flex flex-col xl:gap-9 xl:flex-row xl:justify-between">
        
        <form id="publish-post" class="flex flex-col gap-1 p-4 border-2 border-brand-lighter rounded-2xl mb-4">
          <p class="text-2xl mb-4">Create a new post</p>
          <label for="post-title">Post title*</label>
          <input type="text" id="post-title" name="title" class="input mb-4" required />
          <label for="publish-post-textarea"> Post body</label>
          <textarea
            id="publish-post-textarea"
            name="publishPost"
            rows="5"
            cols="40"  class="input mb-4"
          ></textarea>
          <div class="flex flex-col">
            <p class="mb-4">
              Note! Not all urls can be used. Get the right format by right
              clicking an image and selecting "Copy image address".
            </p>
            <label for="url-string"> Image</label>
            <input class="input mb-4"
              id="url-string"
              type="url"
              name="imageUrl"
              placeholder="eg. https://images.unsplash.com/photo-1582794543139-8ac9cb0f7b11?q=80&w=927&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            />
            <label for="image-alt"> Describe your image </label>
            <input class="input mb-4"
              type="text"
              id="image-alt"
              name="imageAlt"
              placeholder="eg. A bouquet of pink roses"
            />
          </div>

          <label for="tags"> Tags</label>
          <input type="text" class="input mb-4" id="tags" name="tags" maxlength="30" />
          <button id="publish-post-button" class="btn" type="submit">Publish post</button>
        </form>
      </div>

      <div class="container">
        <p class="text-2xl mb-9 ml-4">Profiles you follow</p>
        <ul id="following" class="p-4 grid gap-6 grid-cols-1 border-2 border-brand-lighter rounded-2xl md:grid-cols-2 lg:grid-cols-3 mb-12"></ul>
      </div>

      <h1 class="text-3xl ml-4 mb-9">Posts feed</h1>
      <div class="flex flex-col p-4 gap-4">
        <label for="searchbar"> Search for a post </label>
        <input id="searchbar" class="input mb-4" type="text" />
      </div>
      <section id="render-posts" class="grid grid-cols-1 gap-4"></section>

      <div class="flex flex-row p-4 gap-4 justify-center items-center">
        <button id="prev-button" class="btn">Previous</button>
        <p id="total-pages"></p>
        <button id="next-button" class="btn">Next</button>
      </div>
    </main>
    <script src="./src/main.ts" type="module"></script>
  </body>
</html>
