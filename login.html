<!doctype html>
<html lang="en">

  <body>
    <header class="header-logo">
      <nav>

        ><img src="src/images/logo3.png" alt="company logo" />

    </header>
    <main>
      <div> 
<button id="back-button" class="border-button">
      <svg

        stroke-width="2"

        class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-narrow-left"

</div>
      <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

      <section id="login-section">
        <form id="login-form">
          <label for="login-email-input"> Email adress </label>
          <input id="login-email-input" name="email" type="email" required />
          <label for="login-password-input"> Password </label>
          <input
            id="login-password-input"
            name="password"
            type="password"
            required
          />
          <p>
            Don't have an account? Register <a href="register.html">here</a>
          </p>
          <button id="login-button" type="submit">Log in</button>
        </form>
      </section>
    </main>
    <script src="./src/main.ts" type="module"></script>
