<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WHIMZY | Log in</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="flex flex-col">
    <header
      class="container mx-auto px-8 my-2 bg-brand border-b-2 border-brand-lighter"
    >
      <nav>
        <a href="/index.html"
          ><img
            src="src/images/logo3.png"
            class="h-15 w-auto md:h-20"
            alt="company logo"
          />
        </a>
      </nav>
    </header>
    <main class="container flex flex-col mx-auto">
      <div>
        <button id="back-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-narrow-left"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M5 12l14 0" />
            <path d="M5 12l4 4" />
            <path d="M5 12l4 -4" />
          </svg>
        </button>
      </div>
      <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
      <h1 class="text-center text-3xl font-bold mb-4 md:mb-9">Login</h1>
      <section id="login-section">
        <form id="login-form" class="p-4 flex flex-col justify-center gap-8 md:gap-16 md:p-9">
          <div class="flex flex-col gap-2 self-center w-full md:w-96"> 
          <label for="login-email-input"> Email address </label>
          <input id="login-email-input" class="input" name="email" autocomplete="email" type="email" required />
        </div>
        <div class="flex flex-col gap-2 self-center w-full md:w-96" > 
          <label for="login-password-input"> Password </label>
          <input class="input"
            id="login-password-input"
            name="password" autocomplete="current-password"
            type="password"
            required
          />
        </div>
          <p class="text-center">
            Don't have an account? Register <a class="font-bold" href="register.html">here</a>
          </p>
          <button id="login-button" class="btn" type="submit">Login</button>
        </form>
      </section>
    </main>
    <script src="./src/main.ts" type="module"></script>
  </body>
</html>
