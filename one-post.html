<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <body>
    <div id="pop-up-container"> 
    </div>
    <section id="render-one-post-container"></section>

    </section>
    <script src="/src/main.ts" type="module"></script>
  </body>
