<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WHIMZY | One post</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
   <body class="flex flex-col">
      <header
      class="container mx-auto px-8 my-2 bg-brand border-b-2 border-brand-lighter"
    >
      <nav>
        <a href="/index.html"
          ><img
            src="src/images/logo3.png"
            class="h-15 w-auto md:h-20"
            alt="company logo"
          />
        </a>
      </nav>
    </header>
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
    <dialog id="pop-up-container" class="rounded-2xl"></dialog>
    <dialog id="edit-post-popup-container"></dialog>
    <main class="container flex flex-col mx-auto p-2">
      <div>
        <button id="back-button" class="border-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-narrow-left"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M5 12l14 0" />
            <path d="M5 12l4 4" />
            <path d="M5 12l4 -4" />
          </svg>
        </button>
      </div>

      <div class="flex flex-col gap-6">
        <section id="render-one-post-container"></section>
        <section id="comments" class="flex flex-col mb-9"></section>
        <section>
          <form id="add-comment" class="flex flex-col gap-8">
            <label for="comment-text" class="heading-p">
              Write a comment
            </label>
            <textarea
              class="input"
              id="comment-text"
              name="comment"
              rows="5"
              cols="40"
              placeholder="Add a comment"
              required
            ></textarea>
            <button id="add-comment-button" class="btn" type="submit">Add comment</button>
          </form>
        </section>
      </div>
    </main>
    <script src="./src/main.ts" type="module"></script>
  </body>
</html>
