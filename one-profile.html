<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WHIMZY | One profile</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="flex flex-col">
    <header
      class="container mx-auto px-8 my-2 bg-brand border-b-2 border-brand-lighter"
    >
      <nav>
        <a href="/index.html"
          ><img
            src="src/images/logo3.png"
            class="h-15 w-auto md:h-20"
            alt="company logo"
          />
        </a>
      </nav>
    </header>

    <main class="container flex flex-col mx-auto p-2">
      <div>
        <button id="back-button" class="border-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-narrow-left"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M5 12l14 0" />
            <path d="M5 12l4 4" />
            <path d="M5 12l4 -4" />
          </svg>
        </button>
      </div>
      <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
      <section id="one-profile-container"></section>
      <h2 class="text-2xl mb-9">Posts</h2>
      <section id="own-posts" class="flex flex-col gap-4"></section>
    </main>
    <script src="./src/main.ts" type="module"></script>
  </body>
</html>
