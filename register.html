<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header-logo">
      <nav> 
      <a href="/index.html"
        ><img src="src/images/logo3.png" alt="company logo" />
      </a></nav>
    </header>

    <main>
          <div> 
    <button id="back-button" class="border-button">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-narrow-left"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M5 12l14 0" />
        <path d="M5 12l4 4" />
        <path d="M5 12l4 -4" />
      </svg>
    </button></div>
      <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
      <h1 class="centered-h1">Register</h1>
      <section class="register-section">
        
        <form id="registration-form">
          <label for="registration-username"> Username</label>
          <input
            id="registration-username"
            type="text"
            name="name"
            title="Only letters, numbers and underscores are allowed."
            required
            maxlength="30"
            required
          />

          <label for="registration-email"> Email </label>
          <input
            id="registration-email"
            type="email"
            name="email"
            title="Please only use a 'stud@noroff.no' format"
            required
          />

          <label for="registration-password"> Password </label>
          <input
            id="registration-password"
            type="password"
            name="password"
            title="Create a password with a minimum of 8 characters"
            required
          />

          <label for="registration-password-repeat"> Repeat password </label>
          <input
            id="registration-password-repeat"
            type="password"
            name="confirmPassword"
            title="Please match the previously entered password"
            required
          />
          <label for="bio">Bio: Optional</label>
          <input type="text" name="bio" id="bio" />

          <details class="image-details">
            Right click an image and select "copy image address" for proper
            format.
          </details>
          <label for="register-image-url">
            Add an avatar image: Optional
          </label>
          <input type="url" id="register-image-url" name="avatarUrl" />

          <label for="register-image-alt"> Describe your avatar image </label>
          <input type="text" id="register-image-alt" name="avatarAlt" />
          <p> Already have an account? Log in <a href="/login.html">here</a></p>
          <button type="submit" id="submit-button">Sign up</button>
        </form>
      </section>
    </main>
    <script src="./src/main.ts" type="module"></script>
  </body>
</html>
